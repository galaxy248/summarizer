services:
  summarizer-storage:
    image: minio/minio:RELEASE.2025-05-24T17-08-30Z
    volumes:
      - data:/data
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-admin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-PlKjEnP9mEKuc5aB}
    restart: unless-stopped
    ports:
      - ${MINIO_PORT:-20900}:9000
      - ${MINIO_UI_PORT:-20901}:9001
    command: server /data --console-address ":9001"
    networks:
      default:
        aliases:
          - storage

networks:
  default:
    name: ${NETWORK_NAME:-summarizer_network}
    external: true

volumes:
  data:
    name: summarizer_storage_data
