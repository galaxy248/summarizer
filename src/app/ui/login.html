<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Summarizer</title>
    <link rel="icon" type="image/x-icon" href="/static/image/favicon.ico">
    <link rel="stylesheet" href="/static/styles/auth.css">
    <link rel="stylesheet" href="/static/styles/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
    <script src="/static/js/auth-utils.js"></script>
</head>
<body>
    <header>
        <h1>Welcome Back</h1>
        <p>Sign in to your Summarizer account</p>
    </header>

    <main class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h2>Sign In</h2>
            </div>

            <div id="alert-container"></div>

            <form id="login-form" class="auth-form">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required placeholder="Enter your username">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required placeholder="Enter your password">
                </div>

                <button type="submit" id="login-submit-btn" class="auth-btn primary"><i class="fas fa-arrow-right-to-bracket"></i> Sign In</button>
            </form>

            <div class="auth-footer">
                <p>Don't have an account? <a href="/signup">Sign up here</a></p>
            </div>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const loginForm = document.getElementById('login-form');
            if (loginForm) {
                loginForm.addEventListener('submit', handleLogin);
            }
        });

        async function handleLogin(event) {
            event.preventDefault();
            
            const formData = new FormData(event.target);
            
            try {
                AuthUtils.setButtonLoading('login-submit-btn', true);
                AuthUtils.showAlert('Signing in...', 'info', 'alert-container');
                
                const response = await fetch('/api/v1/auth/user/login', {
                    method: 'POST',
                    body: formData
                });

                if (response.ok) {
                    const data = await response.json();
                    if (data.success) {
                        localStorage.setItem('access_token', data.token);
                        localStorage.setItem('user', JSON.stringify(data.user));
                        
                        AuthUtils.showAlert('Login successful! Redirecting...', 'success', 'alert-container');
                        
                        await AuthUtils.smoothRedirect(
                            data.redirect_url || '/dashboard',
                            'Taking you to your dashboard...',
                            800
                        );
                    } else {
                        AuthUtils.showAlert(data.message || 'Login failed', 'error', 'alert-container');
                    }
                } else {
                    const errorData = await response.json();
                    AuthUtils.showAlert(errorData.detail || 'Login failed', 'error', 'alert-container');
                }
            } catch (error) {
                console.error('Login error:', error);
                AuthUtils.showAlert('Network error occurred. Please try again.', 'error', 'alert-container');
            } finally {
                AuthUtils.setButtonLoading('login-submit-btn', false);
            }
        }
    </script>
    
    <footer style="text-align: center; padding: 20px; margin-top: 40px; border-top: 1px solid #eee; color: #666; font-size: 14px;" class="footer-links">
        <i class="fa-solid fa-code" style="color: #764ba2;"></i> With <i class="fa-solid fa-heart" style="color: #dc143c;"></i> & <i class="fa-solid fa-mug-saucer" style="color: #b38867;"></i> by <a href="https://github.com/galaxy248"> Amir Mohammad Anvari </a> and <a href="https://github.com/AmirMahdiAboo" >Amir Mahdi Abooshahab </a>
    </footer>
</body>
</html>
